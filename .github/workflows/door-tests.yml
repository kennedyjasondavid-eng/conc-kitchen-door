name: DOOR tests

on:
  pull_request:
  push:
    branches:
      - main
    # Budget: DOOR auto-publishes to main constantly, and each publish also makes
    # separate single-file "Update <sidecar>.json" commits. Skip a run when a push
    # touches ONLY files that no gate reads (verified: change_log.json / push-log.txt
    # / docs). A mixed commit that also touches index.html or any read artifact still
    # runs. PR runs are never path-filtered.
    paths-ignore:
      - 'change_log.json'
      - 'push-log.txt'
      - '**/*.md'

# Budget: collapse a burst of publishes on the same ref — cancel superseded
# in-progress runs so only the latest state is validated (no coverage loss; an
# intermediate commit that is immediately superseded needs no independent run).
concurrency:
  group: door-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: DOOR safety checks
    # Keep this OS paired with the reviewed test-only Playwright version.
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run smoke tests
        run: node --test tests/*.mjs

      # F4's actual publisher checks join this runner. C2b will reduce browser
      # selection for ordinary data writes after its operational gate is reviewed.
      - name: Install Playwright for publisher contracts
        if: ${{ !cancelled() }}
        run: npm install --no-save --package-lock=false playwright@1.56.1

      - name: Restore Chromium cache
        if: ${{ !cancelled() }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-${{ runner.os }}-1.56.1

      - name: Install Chromium for publisher contracts
        if: ${{ !cancelled() }}
        run: npx --no-install playwright install --with-deps chromium

      - name: Run coherent publisher browser contracts
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          for gate in tests/browser/menu_flow_f4_producer.mjs tests/browser/menu_flow_f4_input_coverage.mjs tests/browser/menu_flow_f4_occurrence_recovery.mjs tests/browser/menu_flow_f4_occurrence_rollback.mjs tests/browser/menu_flow_f4_private_counter.mjs tests/browser/menu_flow_f4_counter_witness.mjs; do
            node "$gate"
          done

      # Reuse this runner; advisory failures never change the safety result.
      # Still run after a safety failure, but stop spending work on cancelled runs.
      - name: Review architect-set menu decisions
        id: menu_review
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: node --test tests/advisory/menu-decisions.mjs

      - name: Explain advisory result
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.menu_review.outcome }}" == "failure" ]]; then
            echo "::warning title=Menu decisions changed::Review the advisory test output and confirm whether the menu change was intentional."
            echo "### ⚠ Menu decisions changed" >> "$GITHUB_STEP_SUMMARY"
            echo "The application safety checks can still pass. Review the failed meal expectations and confirm whether the menu change was intentional." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "${{ steps.menu_review.outcome }}" == "success" ]]; then
            echo "### ✓ Menu decisions unchanged" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Menu decisions review did not complete" >> "$GITHUB_STEP_SUMMARY"
            echo "No advisory result is available for this run. See the step results above." >> "$GITHUB_STEP_SUMMARY"
          fi
